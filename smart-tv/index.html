<!DOCTYPE html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <!-- Elimina Mixed Content promovendo automaticamente qualquer stream ou redirect http:// para https:// -->
    <meta http-equiv="Content-Security-Policy" content="upgrade-insecure-requests" />
    <title>Zyveron Play - Smart TV</title>
    <!-- Favicon e Ícone -->
    <link rel="icon" type="image/svg+xml" href="./icon.png" />
    <!-- Tizen & webOS tags de compatibilidade -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <style>
      /* Evita scrollbars nativas em Smart TVs e ajusta foco */
      * {
        box-sizing: border-box;
        user-select: none;
        -webkit-user-select: none;
        margin: 0;
        padding: 0;
      }
      body {
        background-color: #0a0d14;
        color: #ffffff;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        overflow: hidden;
        width: 100vw;
        height: 100vh;
      }
      /* Remove contornos padrão de navegadores em favor do foco customizado */
      :focus {
        outline: none;
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="./src/main.tsx"></script>
  </body>
</html>
